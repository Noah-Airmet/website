  <meta name="description" content="Request access to Noah's private Gospel Scholar Archive.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260604-field2">
</head>

<body>

  <!-- shared-nav:start -->
  <header class="site-nav" role="banner">
    <div class="container">
      <a href="index.html" class="nav-logo">noahairmet.com</a>
      <nav aria-label="Main navigation">
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links">
          <a href="blog.html">Writing</a>
          <a href="commitments.html">Commitments</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>
  <!-- shared-nav:end -->

  <main>
    <section class="access-request">
      <div class="container container--narrow">
        <p class="eyebrow">Private archive</p>
        <h1>Request access</h1>
        <p class="access-request__lede">The GSA Assistant is a private research tool for approved friends. Enter your
          email to submit a request to be approved for login.</p>
        <form class="access-request__form" data-access-request-form>
          <div class="access-request__field">
            <label for="access-name">Name</label>
            <input id="access-name" name="name" type="text" autocomplete="name" placeholder="David Harper">
          </div>
          <div class="access-request__field">
            <label for="access-email">Email to approve</label>
            <input id="access-email" name="email" type="email" autocomplete="email" placeholder="you@example.com"
              required>
          </div>
          <div class="access-request__field access-request__field--wide">
            <label for="access-relationship">How do you know Noah?</label>
            <textarea id="access-relationship" name="relationship" rows="4"
              placeholder="A quick note so Noah recognizes the request"></textarea>
          </div>
          <div class="access-request__website" aria-hidden="true">
            <label for="access-website">Website</label>
            <input id="access-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>
          <button class="contact-link" type="submit">Send request</button>
          <p class="access-request__status" data-access-request-status role="status" aria-live="polite"></p>
        </form>
        <div class="access-request__actions">
          <a class="access-request__secondary"
            href="mailto:noah.airmet@icloud.com?subject=Gospel%20Scholar%20Archive%20access%20request&body=Hi%20Noah%2C%0A%0AI%27d%20like%20access%20to%20the%20Gospel%20Scholar%20Archive.%0A%0AName%3A%20%0AEmail%20to%20approve%3A%20%0AHow%20you%20know%20Noah%3A%20">Email
            instead</a>
          <a class="access-request__secondary" href="https://corpus.noahairmet.com">Try signing in again</a>
        </div>
      </div>
    </section>
  </main>

  <!-- shared-footer:start -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Noah Airmet</p>
    </div>
  </footer>
  <!-- shared-footer:end -->

  <script src="js/main.js"></script>
  <script src="js/access-request.js"></script>
</body>

</html>
